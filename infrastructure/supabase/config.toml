# Supabase local development configuration for Jeanius
project_id = "jeanius-local"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3001"]
jwt_expiry = 3600
enable_signup = true

[storage]
file_size_limit = "50MiB"

[storage.buckets.product-media]
public = true
file_size_limit = "25MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.workshop-assets]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["image/png", "image/jpeg", "application/pdf"]

[storage.buckets.customer-uploads]
public = false
file_size_limit = "15MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]
